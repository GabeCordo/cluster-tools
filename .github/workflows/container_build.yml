# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Continuous Integration

on:
  push:
    tags:
      - '*'

jobs:
  build-and-push-container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag: [ linux/amd64, linux/arm64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_ACCESS_TOKEN_WRITE }}

      - name: GitHub Tag Name example
        run: |
          echo "Tag name from GITHUB_REF_NAME: $GITHUB_REF_NAME"
          echo "Tag name from github.ref_name: ${{  github.ref_name }}"

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          GOPRIVATE: github.com/FortifiedCode
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/fortifiedcode/DistributedFunctions:latest
            ghcr.io/fortifiedcode/DistributedFunctions:${{  github.ref_name }}
          secrets: |
            "username=${{ secrets.USERNAME }}"
            "token=${{ secrets.GH_ACCESS_TOKEN }}"
