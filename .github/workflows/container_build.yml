# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Container Continuous Integration

on:
  push:
    tags:
      - '*'

jobs:
  build-and-push-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: GitHub Tag Name example
        run: |
          echo "Tag name from GITHUB_REF_NAME: $GITHUB_REF_NAME"
          echo "Tag name from github.ref_name: ${{  github.ref_name }}"

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          GOPRIVATE: github.com/Sentmint
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          push: true
          tags: |
            sentmint/pipeline-ops:latest
            sentmint/pipeline-ops:${{  github.ref_name }}
            ghcr.io/sentmint/pipeline-ops:latest
            ghcr.io/sentmint/pipeline-ops:${{  github.ref_name }}
  update-production-tag:
    needs: build-and-push-container
    runs-on: ubuntu-latest
    steps:
      - uses: sentmint/DevOps@0.8.0
        with:
          application: pipelines
          service: pipeline-ops
          tag: ${{  github.ref_name }}
          token: ${{ secrets.PAT_TOKEN }}